<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 240px; padding: 14px; font-family: system-ui, -apple-system, sans-serif; margin: 0; }
        h3 { margin: 0 0 10px; font-size: 14px; color: #2c3e50; }
        .status { font-size: 12px; padding: 8px; background: #f8f9fa; border-radius: 4px; margin-bottom: 10px; }
        .status .ok { color: #27ae60; }
        .status .err { color: #e74c3c; }
        .status .warn { color: #f39c12; }
        button { width: 100%; padding: 8px 12px; margin: 4px 0; font-size: 12px; cursor: pointer;
                 border: 1px solid #ddd; border-radius: 4px; background: #fff; transition: all .15s; }
        button:hover { background: #ecf0f1; }
        button:active { background: #dfe6e9; }
        .label { font-size: 11px; color: #7f8c8d; margin-top: 6px; }
        .tag { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 10px; margin: 2px; }
        .tag-ok { background: #d4edda; color: #155724; }
        .tag-no { background: #f8d7da; color: #721c24; }
        code { background: #f0f0f0; padding: 1px 4px; border-radius: 2px; font-size: 11px; }
    </style>
</head>
<body>
    <h3>原始传奇辅助 Demo</h3>

    <div id="detect-result" class="status">点击下方按钮检测页面注入状态</div>
    <div id="engine-info" class="status" style="display:none"></div>

    <button id="btn-detect">检测当前页面</button>
    <button id="btn-inject">手动重新注入</button>

    <div class="label" style="margin-top:12px">使用说明：</div>
    <div class="label" style="line-height:1.5">
        1. 打开 106u 游戏页（登录后进服）<br>
        2. 扩展自动注入，Console 看 <code>[Aux Demo]</code> 日志<br>
        3. Console 输入 <code>__auxDemo.getStatus()</code> 查状态
    </div>

    <script src="popup.js"></script>
</body>
</html>
