                var string = "";

                while (i < utftext.length) {

                            if (emIns.firstPlayer) {
                                var pf = emIns.firstPlayer.fighterObject || {};
                                playerX = emIns.firstPlayer.x != null ? emIns.firstPlayer.x : (pf.gridX || 0);
                                playerY = emIns.firstPlayer.y != null ? emIns.firstPlayer.y : (pf.gridY || 0);
                            } else if (gd.map) {
                                playerX = gd.map.curX || 0;
                                playerY = gd.map.curY || 0;
                            }
                            var dic = emIns._monsterDic;
                            for (var k in dic) {
                                var e = dic[k];
                                if (!e) continue;
                                var cfg = e.monsterObject && e.monsterObject.config ? e.monsterObject.config : null;
                                var fo = e.fighterObject || {};
                                var mx = e.x != null ? e.x : (fo.gridX || 0);
                                var my = e.y != null ? e.y : (fo.gridY || 0);
                                // 计算与主角的网格距离（曼哈顿距离 + 欧几里得距离）
                                var dx = mx - playerX;
                                var dy = my - playerY;
                                var dist = Math.sqrt(dx * dx + dy * dy);
                                var manhattanDist = Math.abs(dx) + Math.abs(dy);
                                var ownerUid = '';
                                var ownerName = '';
                                var ownerIsMine = true;
                                try {
                                    var own = this.resolveMonsterOwnerInfo(e, k);
                                    ownerUid = own.ownerUid;
                                    ownerName = own.ownerName;
                                    ownerIsMine = own.ownerIsMine;
                                } catch (eOwn) {}
                                var hpInfo = this.readMonsterHp(fo);
                                list.push({
                                    id: k,
                                    name: e.name || (cfg ? cfg.name : ''),
                                    configId: cfg ? cfg.id : 0,
                                    x: mx,
                                    y: my,
                                    hp: hpInfo.hp,
                                    maxHp: hpInfo.maxHp,
                                    isDead: hpInfo.isDead,
                                    level: fo.level || (cfg ? cfg.level : 0),
                                    monsterType: cfg ? cfg.type : 0,
                                    gather: cfg ? cfg.gather : 0,
                                    group: fo.group || 0,
                                    ownerUid: ownerUid,
                                    ownerName: ownerName,
                                    ownerIsMine: ownerIsMine,
                                    distance: Math.round(dist * 100) / 100,
                                    manhattanDist: Math.round(manhattanDist * 100) / 100,
                                    playerX: Math.round(playerX * 100) / 100,
                                    playerY: Math.round(playerY * 100) / 100
                                });
                            }
                            // 按距离排序
                            list.sort(function(a, b){ return a.distance - b.distance; });
                        }
                    } catch (err) { }
                    return list;
                },
                // 在游戏中选中指定怪物
                selectMonster: function (uid) {

                        return { success: false, reason: err.message };

                },
                // 视野内可拾取掉落（参考 main10 getAllDrop / keyPickup）
                getDropList: function () {

                            });

                },
                /**
                 * 打断游戏内「强制选怪打怪」环：
                 * SettingData.autoKillSelectMonster 每 2s 会选中匹配等级的小怪并 setAutoFight(1)；

                 */
                suppressForceFight: function () {
                    try {
                        if (window.gd && gd.setting) {

                        if (window.gd && gd.arpgInst) {
                            gd.arpgInst.findMonsterid = 0;

                                gd.arpgInst.setAutoFight(3);

                            success: true,

                /**

                 * 仅停超级挂机强制选怪，避免拾取期去打小怪。

                beginLootMode: function () {

                            var player = emIns.firstPlayer;

                                }

                        if (gd.arpgInst && gd.arpgInst.setAutoFight) {
                            gd.arpgInst.setAutoFight(1);
                        }

                        return {

                },
                /** 拾取期维持：保证自动战斗开着，并挡住超级挂机强制选怪；不碰 AutoPick / autoPet */
                maintainLootMode: function () {
                    try {
                        if (!window.__lootModeActive) return { success: false, reason: 'not in loot' };
                        if (window.gd && gd.setting) {
                            gd.setting.isCure = true;
                            if (gd.setting.selectkillKey > 0) {
                                clearInterval(gd.setting.selectkillKey);
                                gd.setting.selectkillKey = 0;
                            }
                            if (gd.setting.selectkillKey1 > 0) {

                            gd.arpgInst.setAutoFight(1);

                            success: true,

                        };

                },
                endLootMode: function () {

                            gd.arpgInst.setAutoFight = gd.arpgInst.__origSetAutoFight;

                },
                // 停强制打怪 + 走最近掉落（等同拾取键；Boss 后拾取已改用 beginLootMode）
                pickupNearest: function () {
                    try {
                        this.suppressForceFight();
                        var player = window.emIns && emIns.firstPlayer;
                        if (!player) return { success: false, reason: '无主角' };
                        try {
                            if (window.AIManager && AIManager.instance) {
                                if (player._entityAI && player._entityAI.stop) {
                                    try { player._entityAI.stop(); } catch (eStop) {}
                                }
                                player._entityAI = AIManager.instance.getAI(0);

                            }
                            if (GameSceneManager && GameSceneManager.Instance &&

                        } catch (eAI) {}

                        var drops = this.getDropList();

                },
                // 获取视野内所有实体（怪物/玩家/NPC/随从/掉落）
                getEntityList: function () {

                                        uid: this.normalizeId(e.realUid || (e.playerObject && e.playerObject.uid) || k),
                                        unionId: this.normalizeId(e.playerObject && e.playerObject.unionId),
                                        unionName: (e.playerObject && e.playerObject.unionName) || '',
                                        x: e.x != null ? e.x : (fo.gridX || 0),

                                    });

                                    if (!e) continue;
                                    result.npcs.push({ id: k, name: e.name || '', x: e.x || 0, y: e.y || 0 });
                                }

                                for (var k in emIns._minionDic) {
                                    var e = emIns._minionDic[k];

                                    result.minions.push({ id: k, name: e.name || '', x: e.x || 0, y: e.y || 0 });

                },
                getPlayerInfo: function () {

                        return { error: err.message };

                },
                // ===== 挂机编排：运行态快照 =====
                getRuntimeState: function () {
                    var state = {
                        ready: !!(window.gd && gd.player && gd.map),
                        connected: false,
                        player: null,
                        map: null,
                        autoFightType: null,
                        guajiType: null,
                        monsterCount: 0,
                        aliveMonsterCount: 0,
                        nearestMonster: null,
                        bossAliveCount: 0,
                        ts: Date.now()
                    };
                    try {
                        if (window.NetManager && NetManager.Instance && NetManager.Instance._connect) {
                            state.connected = !!NetManager.Instance._connect.connected();
                        }
                    } catch (e) {}
                    try {
                        if (!window.gd || !gd.player) {
                            try { state.server = this.getServerTimeState(); } catch (eS0) { state.server = null; }
                            return state;
                        }
                        var p = gd.player;
                        var fo = (window.emIns && emIns.firstPlayer && emIns.firstPlayer.fighterObject) ? emIns.firstPlayer.fighterObject : null;
                        var gridX = null;
                        var gridY = null;
                        if (window.emIns && emIns.firstPlayer) {
                            var fp = emIns.firstPlayer;
                            var ffo = fp.fighterObject || {};
                            // 刷新点/minimap 为网格格；优先 fighterObject.gridX，勿用 fp.x（常为像素）
                            gridX = ffo.gridX != null ? ffo.gridX : (fp.gameObject && fp.gameObject.gridX != null ? fp.gameObject.gridX : null);
                            gridY = ffo.gridY != null ? ffo.gridY : (fp.gameObject && fp.gameObject.gridY != null ? fp.gameObject.gridY : null);
                            if (gridX == null && gd.map) gridX = gd.map.curX;
                            if (gridY == null && gd.map) gridY = gd.map.curY;
                        }
                        var pHpInfo = this.readPlayerHp();
                        state.player = {
                            uid: this.normalizeId(p.uid),
                            name: p.roleName || '',
                            level: p.level,
                            career: fo && fo.career != null ? fo.career : (p.career || 0),
                            hp: pHpInfo.hp,
                            hpMax: pHpInfo.maxHp,
                            mp: fo && fo.mp != null ? fo.mp : (p.mp || 0),

                            y: gd.map ? gd.map.curY : null,
                            gridX: gridX,
                            gridY: gridY
                        };

                            name: mapCfg ? mapCfg.name : '',

                        };

                        state.duplicateId = state.inDuplicate ? (gd.arpgInst.cfgId || 0) : 0;
                        state.autoFightType = gd.arpgInst ? gd.arpgInst.autoFightType : null;
                        state.fightModel = gd.arpgInst ? gd.arpgInst.fightModel : null;
                        state.guajiType = gd.setting ? gd.setting.guajitype : null;
                        state.autoPick = !!gd.player.AutoPick;
                        try {
                            state.autoPet = !!(gd.player.autoPet && gd.player.autoPet());
                        } catch (ePet) { state.autoPet = false; }
                        state.farmPickupForce = !!window.__farmPickupForce;
                        state.lootModeActive = !!window.__lootModeActive;
                        try {
                            state.dropCount = (typeof this.getDropList === 'function') ? this.getDropList().length : 0;
                        } catch (eD) { state.dropCount = 0; }
                        try {
                            state.emptySlots = gd.bag ? gd.bag.emptyItemGridCount : null;
                        } catch (eB) { state.emptySlots = null; }
                        try {
                            state.hasPortableRecycle = this.hasPortableRecycle();
                        } catch (eH) { state.hasPortableRecycle = false; }
                        if (window.emIns && emIns._monsterDic) {
                            var nearest = null;
                            for (var k in emIns._monsterDic) {
                                var m = emIns._monsterDic[k];
                                if (!m) continue;
                                state.monsterCount++;
                                var mfo = m.fighterObject || {};
                                var mHp = this.readMonsterHp(mfo);
                                if (!mHp.isDead) {
                                    state.aliveMonsterCount++;
                                    var mx = m.x != null ? m.x : (mfo.gridX || 0);
                                    var my = m.y != null ? m.y : (mfo.gridY || 0);
                                    var px = state.player.x || 0, py = state.player.y || 0;
                                    var dist = Math.sqrt((mx - px) * (mx - px) + (my - py) * (my - py));
                                    var cfg = m.monsterObject && m.monsterObject.config ? m.monsterObject.config : null;
                                    if (!nearest || dist < nearest.distance) {
                                        nearest = {
                                            id: k,
                                            name: m.name || (cfg ? cfg.name : ''),
                                            configId: cfg ? cfg.id : 0,
                                            distance: Math.round(dist * 100) / 100,
                                            hp: mHp.hp,
                                            maxHp: mHp.maxHp,
                                            isDead: false
                                        };
                                    }
                                }
                            }
                            state.nearestMonster = nearest;
                        }
                        try {
                            state.combatTarget = null;
                            if (window.emIns && emIns.firstPlayer && emIns.firstPlayer._entityTargetId) {
                                var tid = emIns.firstPlayer._entityTargetId;
                                var tent = emIns.getEntity ? emIns.getEntity(tid) : null;
                                if (tent && tent.monsterObject) {
                                    var tfo = tent.fighterObject || {};
                                    var tcfg = tent.monsterObject.config || {};
                                    var cOwnerUid = '';
                                    var cOwnerName = '';
                                    var ownT = this.resolveMonsterOwnerInfo(tent, tid);
                                    cOwnerUid = ownT.ownerUid;
                                    cOwnerName = ownT.ownerName;
                                    var cOwnerIsMine = ownT.ownerIsMine;
                                    var tHp = this.readMonsterHp(tfo);
                                    state.combatTarget = {
                                        id: tid,
                                        name: tent.name || tcfg.name || '',
                                        configId: tcfg.id || 0,
                                        hp: tHp.hp,
                                        hpMax: tHp.maxHp,
                                        isDead: tHp.isDead,
                                        ownerUid: cOwnerUid,
                                        ownerName: cOwnerName,
                                        ownerIsMine: cOwnerIsMine,
                                        monsterType: tcfg.type || 0
                                    };
                                }
                            }
                        } catch (eCt) { state.combatTarget = null; }
                        if (gd.boss && gd.boss.arpgBossInfoDic) {
                            for (var bid in gd.boss.arpgBossInfoDic) {
                                var b = gd.boss.arpgBossInfoDic[bid];
                                if (b && b.dieState === 0 && b.hp > 0) state.bossAliveCount++;
                            }
                        }
                        try {
                            if (typeof this.getQunyingState === 'function') {
                                state.qunying = this.getQunyingState();
                            }
                        } catch (eQ) { state.qunying = null; }
                        try {
                            state.server = this.getServerTimeState();
                        } catch (eS) { state.server = null; }
                    } catch (err) {
                        state.error = err.message;
                    }
                    return state;
                },
                /** 游戏服时间（心跳同步），供父页面日切 / 时段判断 */
                getServerTimeState: function () {
                    var server = {
                        now: 0,
                        curZeroTime: 0,
                        openDay: 0,
                        secSinceMidnight: 0,
                        secToMidnight: 0,
                        dayKey: ''
                    };
                    try {
                        if (!window.gd || !gd.serv) return server;
                        var now = 0;
                        if (window.DateUtil && typeof DateUtil.serverNow === 'function') {
                            now = DateUtil.serverNow();
                        } else if (gd.serv.servertime != null && window.egret && egret.getTimer) {
                            now = gd.serv.servertime + egret.getTimer();
                        }
                        var zero = Number(gd.serv.curZeroTime) || 0;
                        server.now = now;
                        server.curZeroTime = zero;
                        server.openDay = gd.serv.openDay != null ? Number(gd.serv.openDay) : 0;
                        if (zero && now) {

                getGDProperty: function (path) {
                    try {
                        var parts = path.split('.');
                        var rootObj = null;
                        var startIdx = 0;
                        // 支持 net.xxx 或 egret.xxx 等全局访问
                        if (parts[0] === 'gd' && window.gd) {
                            rootObj = window.gd;
                            startIdx = 1;
                        } else if (parts[0] === 'net' && window.net) {
                            rootObj = window.net;
                            startIdx = 1;
                        } else if (parts[0] === 'egret' && window.egret) {
                            rootObj = window.egret;
                            startIdx = 1;
                        } else if (window.gd && window.gd[parts[0]] !== undefined) {
                            rootObj = window.gd;
                        } else if (window[parts[0]] !== undefined) {
                            rootObj = window;
                        } else {
                            return { error: 'Cannot find root for: ' + path, path: path };
                        }
                        var cur = rootObj;
                        for (var i = startIdx; i < parts.length; i++) {
                            if (cur == null) return { error: 'undefined at ' + parts[i], path: path };
                            cur = cur[parts[i]];
                        }
                        if (cur !== null && typeof cur === 'object') {
                            try {
                                return JSON.parse(JSON.stringify(cur));
                            } catch(e) {
                                return { value: String(cur).substring(0, 500), type: typeof cur };
                            }
                        }
                        return { value: cur, type: typeof cur };
                    } catch (e) {
                        return { error: e.message, path: path };

                        type: 'gameResponse',
                        from: 'iframe',
                        action: msg.action,
                        payload: result,
                        ts: msg.ts
                    }, '*');
                }
            }, false);

            // 通知 parent：游戏已就绪
            function notifyReady() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'gameReady',
                        from: 'iframe',
                        payload: { time: Date.now() }
                    }, '*');
                }
            }

            // 自动请求BOSS数据（在游戏就绪后延迟执行）
            function autoRequestBossData() {
                if (_bossDataAutoRequested) return;
                _bossDataAutoRequested = true;
                setTimeout(function() {
                    // 1. 请求常规BOSS列表
                    var types = [3, 4, 5, 6, 7, 24, 25, 26, 27];
                    if (window.net && net.PlayModel && net.PlayModel.ins) {
                        for (var i = 0; i < types.length; i++) {
                            try { net.PlayModel.ins().send9(types[i]); } catch(e) {}
                        }
                    }
                    // 2. 请求副本BOSS
                    if (window.net && net.BossModel && net.BossModel.ins) {
                        try { net.BossModel.ins().send1(); } catch(e) {}
                    }
                    // 3. 请求首领挑战
                    if (window.net && net.GradBossModel && net.GradBossModel.ins) {
                        try { net.GradBossModel.ins().send1(); } catch(e) {}
                        try { net.GradBossModel.ins().send9(); } catch(e) {}
                        try { net.GradBossModel.ins().send4(); } catch(e) {}
                    }
                    // 4. 延迟后主动推一次BOSS数据快照
                    setTimeout(function() {
                        if (window.parent && window.parent !== window) {
                            try {
                                window.parent.postMessage({
                                    type: 'socketMsg',
                                    cmd: 0,
                                    count: _hookedMsgCount,
                                    autoSnapshot: true,
                                    ts: Date.now()
                                }, '*');
                            } catch(e) {}
                        }
                    }, 3000);
                }, 1000);
            }

            function installPkSkillHook() {
                if (window.__pkSkillHooked) return;
                if (!window.ARPGInstanceBase || !ARPGInstanceBase.prototype || !ARPGInstanceBase.prototype.skill) {
                    setTimeout(installPkSkillHook, 200);
                    return;
                }
                var orig = ARPGInstanceBase.prototype.skill;
                ARPGInstanceBase.prototype.skill = function (e) {
                    try {
                        if (window.__gameBridge && typeof __gameBridge._onPkSkill === 'function') {
                            __gameBridge._onPkSkill(e);
                        }
                    } catch (x) {}
                    return orig.call(this, e);
                };
                window.__pkSkillHooked = true;
            }

            // 延迟等待 egret 初始化完成
            let waitCount = 0;
            const timer = setInterval(function () {
                waitCount++;
                if (window.gd && gd.inst) {
                    clearInterval(timer);
                    // 安装socket消息钩子
                    installSocketHook();
                    installConnectionHook();
                    installBossNotifyHook();
                    installShoulingBossHook();
                    installActivityWatch();
                    installDayResetHook();
                    installQunyingTurboHook();
                    installPkSkillHook();
                    // 安装后延迟通知parent
                    setTimeout(function(){
                        notifyReady();
                    }, 500);
                    // 游戏连接建立后自动请求BOSS数据
                    var netCheckCount = 0;
                    var netCheckTimer = setInterval(function() {
                        netCheckCount++;
                        if ((window.NetManager && NetManager.Instance && NetManager.Instance._connect && NetManager.Instance._connect.connected()) || netCheckCount > 100) {
                            clearInterval(netCheckTimer);
                            if (window.NetManager && NetManager.Instance && NetManager.Instance._connect && NetManager.Instance._connect.connected()) {
                                autoRequestBossData();
                            }
                        }
                    }, 100);
                } else if (waitCount > 600) {
                    clearInterval(timer);
                    notifyReady();
                }
            }, 100);
        })();
